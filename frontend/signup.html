<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up — ToneWear AI</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/animations.css">
  <style>
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #EBF2FF 0%, #EDE9FF 50%, #F8FAFF 100%);
      padding: 24px;
    }

    .blob { position: fixed; }

    .auth-card {
      background: rgba(255,255,255,0.82);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255,255,255,0.65);
      border-radius: 28px;
      box-shadow: 0 20px 80px rgba(26,86,219,0.14);
      padding: 48px 40px;
      width: 100%;
      max-width: 440px;
      animation: scaleIn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .auth-logo { display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 8px; }
    .auth-logo-icon { width: 44px; height: 44px; background: var(--gradient); border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 22px; }
    .auth-logo-text { font-size: 22px; font-weight: 700; background: var(--gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
    .auth-tagline { text-align: center; font-size: 14px; color: var(--text-muted); margin-bottom: 32px; }
    #sign-up { min-height: 200px; }
    .auth-footer { text-align: center; margin-top: 24px; font-size: 14px; color: var(--text-muted); }
    .auth-footer a { color: var(--primary); font-weight: 600; }

    .value-props { display: flex; flex-direction: column; gap: 10px; margin-bottom: 24px; }
    .value-prop  { display: flex; gap: 10px; align-items: center; font-size: 13px; color: var(--text-secondary); }
    .value-prop-icon { font-size: 18px; flex-shrink: 0; }

    .fallback-form { display: flex; flex-direction: column; gap: 14px; }
    .name-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  </style>
</head>
<body>

<div class="blob blob-blue"   style="width:350px;height:350px;top:-100px;left:-100px;opacity:0.12;filter:blur(70px);animation:floatSlow 7s ease-in-out infinite;"></div>
<div class="blob blob-purple" style="width:300px;height:300px;bottom:-80px;right:-80px;opacity:0.12;filter:blur(70px);animation:floatSlow 8s ease-in-out 2s infinite;"></div>

<div class="auth-card">
  <div class="auth-logo">
    <div class="auth-logo-icon">✨</div>
    <span class="auth-logo-text">ToneWear AI</span>
  </div>
  <div class="auth-tagline">Create your free account to get started</div>

  <!-- Value Props -->
  <div class="value-props">
    <div class="value-prop"><span class="value-prop-icon">🔬</span> AI skin analysis in seconds</div>
    <div class="value-prop"><span class="value-prop-icon">👔</span> Culturally tailored outfit recommendations</div>
    <div class="value-prop"><span class="value-prop-icon">📋</span> Save unlimited analysis sessions</div>
  </div>

  <!-- Clerk Sign Up -->
  <div id="sign-up">
    <!-- Fallback form -->
    <div class="fallback-form">
      <div class="name-row">
        <div class="form-group">
          <label class="form-label">First Name</label>
          <input type="text" class="form-input" placeholder="Ahmed">
        </div>
        <div class="form-group">
          <label class="form-label">Last Name</label>
          <input type="text" class="form-input" placeholder="Khan">
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">Email Address</label>
        <input type="email" class="form-input" placeholder="you@example.com">
      </div>
      <div class="form-group">
        <label class="form-label">Password</label>
        <input type="password" class="form-input" placeholder="Min 8 characters">
      </div>
      <button class="btn btn-primary btn-full" onclick="window.location.href='analyzer.html'">
        Create Free Account →
      </button>
      <button class="btn btn-ghost btn-full" onclick="window.location.href='analyzer.html'">
        Skip — Try Demo Mode
      </button>
      <p style="font-size:11px;color:var(--text-muted);text-align:center">
        By signing up you agree to our <a href="#" style="color:var(--primary)">Terms</a> and <a href="#" style="color:var(--primary)">Privacy Policy</a>
      </p>
    </div>
  </div>

  <div class="auth-footer">
    Already have an account? <a href="login.html">Sign in</a>
  </div>
</div>

<script src="js/app.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
