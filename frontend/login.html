<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — ToneWear AI</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/animations.css">
  <style>
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: var(--bg-main);
      padding: var(--sp-6);
    }

    .auth-card {
      background-color: var(--bg-card);
      border: 1px solid var(--border-default);
      border-radius: var(--radius-default);
      padding: var(--sp-10) var(--sp-8);
      width: 100%;
      max-width: 400px;
      box-shadow: var(--shadow-sm);
    }

    .auth-logo {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: var(--sp-2);
      margin-bottom: var(--sp-2);
    }

    .auth-logo-text {
      font-size: 20px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .auth-tagline {
      text-align: center;
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: var(--sp-8);
    }

    .auth-footer {
      text-align: center;
      margin-top: var(--sp-6);
      font-size: 13px;
      color: var(--text-muted);
    }

    .auth-footer a {
      color: var(--text-primary);
      font-weight: 600;
    }

    .fallback-divider {
      text-align: center;
      font-size: 11px;
      color: var(--text-muted);
      margin: var(--sp-2) 0;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
  </style>
</head>
<body>

<div class="auth-card">
  <div class="auth-logo">
    <span style="font-size:24px;">✨</span>
    <span class="auth-logo-text">ToneWear AI</span>
  </div>
  <p class="auth-tagline">Sign in to your style personalization profile</p>

  <!-- Clerk Sign In mount -->
  <div id="sign-in">
    <div class="flex flex-col gap-4">
      <div class="form-group">
        <label class="form-label">Email Address</label>
        <input type="email" class="form-input" placeholder="you@example.com">
      </div>
      <div class="form-group">
        <label class="form-label">Password</label>
        <input type="password" class="form-input" placeholder="••••••••">
      </div>
      <button class="btn btn-primary w-full text-center" onclick="window.location.href='analyzer.html'">
        Sign In
      </button>
      <div class="fallback-divider">or</div>
      <button class="btn btn-secondary w-full text-center" onclick="window.location.href='analyzer.html'">
        Continue as Guest (Demo Mode)
      </button>
    </div>
  </div>

  <div class="auth-footer">
    Don't have an account? <a href="signup.html">Sign up free</a>
  </div>
</div>

<script src="js/app.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
