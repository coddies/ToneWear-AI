<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up — ToneWear AI</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/animations.css">
  <style>
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: var(--bg-main);
      padding: var(--sp-6);
    }

    .auth-card {
      background-color: var(--bg-card);
      border: 1px solid var(--border-default);
      border-radius: var(--radius-default);
      padding: var(--sp-10) var(--sp-8);
      width: 100%;
      max-width: 440px;
      box-shadow: var(--shadow-sm);
    }

    .auth-logo {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: var(--sp-2);
      margin-bottom: var(--sp-2);
    }

    .auth-logo-text {
      font-size: 20px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .auth-tagline {
      text-align: center;
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: var(--sp-6);
    }

    .value-props {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: var(--sp-6);
      border-bottom: 1.5px solid var(--border-subtle);
      padding-bottom: var(--sp-4);
    }

    .value-prop {
      display: flex;
      gap: var(--sp-2);
      align-items: center;
      font-size: 12px;
      color: var(--text-secondary);
    }

    .auth-footer {
      text-align: center;
      margin-top: var(--sp-6);
      font-size: 13px;
      color: var(--text-muted);
    }

    .auth-footer a {
      color: var(--text-primary);
      font-weight: 600;
    }

    .name-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: var(--sp-3);
    }
  </style>
</head>
<body>

<div class="auth-card">
  <div class="auth-logo">
    <span style="font-size:24px;">✨</span>
    <span class="auth-logo-text">ToneWear AI</span>
  </div>
  <p class="auth-tagline">Create your free personalization account</p>

  <!-- Value Props -->
  <div class="value-props">
    <div class="value-prop"><span>🔬</span> <span class="font-semibold">AI Skin Scan:</span> Instant tone mapping</div>
    <div class="value-prop"><span>👔</span> <span class="font-semibold">Match Ratios:</span> Custom cultural lookbooks</div>
    <div class="value-prop"><span>📋</span> <span class="font-semibold">Style History:</span> Save and share outputs</div>
  </div>

  <!-- Clerk Sign Up mount -->
  <div id="sign-up">
    <div class="flex flex-col gap-4">
      <div class="name-row">
        <div class="form-group">
          <label class="form-label">First Name</label>
          <input type="text" class="form-input" placeholder="Ahmed">
        </div>
        <div class="form-group">
          <label class="form-label">Last Name</label>
          <input type="text" class="form-input" placeholder="Khan">
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">Email Address</label>
        <input type="email" class="form-input" placeholder="you@example.com">
      </div>
      <div class="form-group">
        <label class="form-label">Password</label>
        <input type="password" class="form-input" placeholder="Min 8 characters">
      </div>
      <button class="btn btn-primary w-full text-center" onclick="window.location.href='analyzer.html'">
        Create Account
      </button>
      <button class="btn btn-secondary w-full text-center" onclick="window.location.href='analyzer.html'">
        Skip — Try Demo Mode
      </button>
    </div>
  </div>

  <div class="auth-footer">
    Already have an account? <a href="login.html">Sign in</a>
  </div>
</div>

<script src="js/app.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
